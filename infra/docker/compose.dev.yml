# COOPECA — Docker Compose de DÉVELOPPEMENT LOCAL
# ---------------------------------------------------------------------
# Usage : docker compose -f infra/docker/compose.dev.yml up
#
# Règles :
# - PostgreSQL n'est exposé QUE sur localhost (127.0.0.1) ;
# - volume persistant pour conserver les données entre redémarrages ;
# - healthcheck PostgreSQL pour démarrer l'API seulement quand la base est prête ;
# - aucun secret réel ici : les identifiants de développement ci-dessous
#   sont publics et SONT SÉPARÉS des secrets de production, injectés via
#   le gestionnaire de secrets du déploiement.
# - ne jamais pointer cette configuration vers une base de production.

services:
  postgres:
    image: postgres:16-alpine
    container_name: coopeca-postgres-dev
    restart: unless-stopped
    env_file: .env
    environment:
      # Identifiants de DÉVELOPPEMENT uniquement — à remplacer localement
      # par des valeurs issues de backend/.env (jamais versionnées).
      POSTGRES_DB: ${POSTGRES_DB:-coopeca}
      POSTGRES_USER: ${POSTGRES_USER:-coopeca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans infra/docker/.env}
    ports:
      # Exposition locale uniquement. Ne jamais publier ce port en production.
      - "127.0.0.1:5433:5432"
    volumes:
      - coopeca_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: coopeca-redis-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - coopeca_redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  coopeca_pgdata_dev:
    name: coopeca_pgdata_dev
  coopeca_redis_dev:
    name: coopeca_redis_dev
